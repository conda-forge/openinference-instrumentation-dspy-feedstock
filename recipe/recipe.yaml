schema_version: 1

context:
  version: "0.1.58"
  build_number: "0"

package:
  name: openinference-instrumentation-dspy
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/openinference-instrumentation-dspy/openinference_instrumentation_dspy-${{ version }}.tar.gz
  sha256: 7475c045574174d8241b27392fead5f81978709001c62f4581550eb9dc67cdaa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api
    - opentelemetry-instrumentation
    - opentelemetry-semantic-conventions
    - openinference-instrumentation >=0.1.82
    - openinference-semantic-conventions >=0.1.46
    - wrapt
    - typing-extensions

tests:
  - python:
      imports:
        - openinference.instrumentation.dspy
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenInference DSPy Instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Arize-ai/openinference

extra:
  recipe-maintainers:
    - michaelschiff
    - mikeldking
    - RogerHYang
    - axiomofjoy
    - anticorrelator
    - jsmolic
